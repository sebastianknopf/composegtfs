services:

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgsqldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # ── Graphhopper (optional) ──────────────────────────────────────────────────
  # Start with: docker compose --profile graphhopper up
  graphhopper:
    build:
      context: ./graphhopper
    profiles:
      - graphhopper
    environment:
      # URL of the .osm.pbf file to download on first start (if /data/map.osm.pbf
      # is not already present in the named volume).
      OSM_PBF_URL: ${OSM_PBF_URL:-}
      # Java heap settings – tune to available memory.
      JAVA_OPTS: ${GH_JAVA_OPTS:--Xmx1g -Xms512m}
    volumes:
      - ./graphhopper/config.yml:/config/config.yml:ro
      - ./graphhopper/profiles:/config/profiles:ro
      - graphhopper_data:/data
    expose:
      - "8989"
    restart: unless-stopped

volumes:
  pgsqldata:
  graphhopper_data:
